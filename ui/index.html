<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flow Bridge</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <style>
    :root {
      --bg: #09090b;
      --card: #111113;
      --border: #202023;
      --border-hover: #323238;
      --text: #ededed;
      --text-muted: #80808a;
      --text-dim: #52525b;
      --green: #22c55e;
      --green-dim: rgba(34, 197, 94, 0.12);
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, sans-serif;
      --font-mono: "SF Mono", Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.5;
      padding: 20px;
      max-width: 680px;
      margin: 0 auto;
      user-select: none;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 16px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .brand-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Compact Header Engines Cluster */
    .header-engines {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .engine-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      transition: all 0.15s ease;
    }

    .engine-chip.active {
      color: var(--text);
      border-color: rgba(34, 197, 94, 0.25);
      background: #141417;
    }

    .engine-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--green);
      flex-shrink: 0;
    }

    .engine-dot.inactive {
      background: var(--text-dim);
    }

    /* Section Bar */
    .section-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
    }

    .section-hint {
      font-size: 11px;
      color: var(--text-dim);
    }

    .kbd {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 1px 4px;
      border-radius: 3px;
      background: #18181b;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    /* History Feed */
    .feed {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .feed-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .feed-item:hover {
      border-color: var(--border-hover);
      background: #141417;
    }

    .feed-body {
      flex: 1;
      min-width: 0;
    }

    .feed-text {
      font-size: 13px;
      color: #dedee0;
      line-height: 1.45;
      word-break: break-word;
      user-select: text;
      margin-bottom: 5px;
    }

    .feed-meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 7px;
      border-radius: 999px;
      background: #17171a;
      border: 1px solid var(--border);
      font-size: 10px;
    }

    .source-tag {
      font-weight: 500;
      color: #a1a1aa;
    }

    .meta-separator {
      font-size: 9px;
      color: var(--text-dim);
    }

    .feed-time {
      color: var(--text-dim);
      font-family: var(--font-mono);
    }

    /* Copy Button */
    .copy-button {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-dim);
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s ease;
      margin-top: 1px;
    }

    .copy-button:hover {
      color: var(--text);
      border-color: var(--border-hover);
      background: #1c1c20;
    }

    .copy-button:active {
      transform: scale(0.92);
    }

    .copy-button.copied {
      color: var(--green);
      border-color: rgba(34, 197, 94, 0.4);
      background: var(--green-dim);
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 36px 20px;
      color: var(--text-dim);
      font-size: 12px;
      border: 1px dashed var(--border);
      border-radius: 8px;
    }

    /* Footer */
    .footer {
      margin-top: 20px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-dim);
    }
  </style>
</head>
<body>

  <!-- Header with Brand on Left and Engine Chips on Right -->
  <header class="header">
    <div class="brand">
      <img src="/logo.png" alt="Logo" class="brand-icon">
      <div>
        <div class="brand-title">Flow Bridge</div>
        <div class="brand-subtitle">Universal Dictation Copy</div>
      </div>
    </div>
    <div class="header-engines" id="header-engines">
      <!-- Populated dynamically without layout jumps -->
    </div>
  </header>

  <!-- Recent Dictation Feed -->
  <div class="section-bar">
    <span class="section-title">Latest Dictations</span>
    <span class="section-hint">Press <kbd class="kbd">⌘ + V</kbd> anywhere to paste</span>
  </div>

  <div class="feed" id="history-container">
    <!-- Populated by JS -->
  </div>

  <!-- Minimal Footer -->
  <footer class="footer">
    <span>Background clipboard sync</span>
    <span>Auto-settle & hold active</span>
  </footer>

  <script>
    const copySvg = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>`;
    const checkSvg = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;

    let lastHistoryHash = '';
    let lastAppsHash = '';

    async function fetchState() {
      try {
        const res = await fetch('/api/state');
        if (!res.ok) return;
        const data = await res.json();
        renderApps(data.apps);
        renderHistory(data.history);
      } catch (e) {
        // network or server restart
      }
    }

    function renderApps(apps) {
      if (!apps) return;
      const hash = JSON.stringify(apps.map(a => a.name + a.available));
      if (hash === lastAppsHash) return; // Prevent unnecessary DOM teardown
      lastAppsHash = hash;

      const container = document.getElementById('header-engines');
      if (!container) return;

      container.innerHTML = apps.map(app => `
        <div class="engine-chip ${app.available ? 'active' : ''}" title="${app.name}: ${app.available ? 'Connected' : 'Not installed'}">
          <span class="engine-dot ${app.available ? '' : 'inactive'}"></span>
          <span>${escapeHtml(app.name)}</span>
        </div>
      `).join('');
    }

    function renderHistory(items) {
      if (!items) return;
      // Only re-render when dictations actually change to prevent hover-glitching
      const hash = JSON.stringify(items.map(i => i.id + i.text));
      if (hash === lastHistoryHash) return;
      lastHistoryHash = hash;

      const container = document.getElementById('history-container');
      if (!container) return;

      if (items.length === 0) {
        container.innerHTML = `<div class="empty-state">No dictations recorded yet. Speak into Wispr Flow, Handy, or Detta.</div>`;
        return;
      }

      container.innerHTML = items.map((item, idx) => `
        <div class="feed-item">
          <div class="feed-body">
            <div class="feed-text">${escapeHtml(item.text)}</div>
            <div class="feed-meta-pill">
              <span class="source-tag">${escapeHtml(item.source)}</span>
              <span class="meta-separator">•</span>
              <span class="feed-time">${item.time}</span>
            </div>
          </div>
          <button class="copy-button" title="Copy transcript to clipboard" onclick="copyText(${idx}, this)">
            ${copySvg}
          </button>
        </div>
      `).join('');

      window._items = items;
    }

    function copyText(idx, btn) {
      const item = window._items?.[idx];
      if (!item) return;

      navigator.clipboard.writeText(item.text).then(() => {
        btn.classList.add('copied');
        btn.innerHTML = checkSvg;
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = copySvg;
        }, 1500);
      });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    fetchState();
    setInterval(fetchState, 1500);
  </script>
</body>
</html>
