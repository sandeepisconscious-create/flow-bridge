<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flow Bridge</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <style>
    :root {
      --bg: #09090b;
      --card: #111113;
      --border: #202023;
      --border-hover: #323238;
      --text: #ededed;
      --text-muted: #8e8e93;
      --text-dim: #52525b;
      --green: #22c55e;
      --green-glow: rgba(34, 197, 94, 0.4);
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, sans-serif;
      --font-mono: "SF Mono", Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.5;
      padding: 16px 20px 20px;
      max-width: 680px;
      margin: 0 auto;
      user-select: none;
    }

    /* Top Brand Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 14px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .brand-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Neutral Subtle Engine Chips (NO GREEN) */
    .header-engines {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .engine-chip {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 999px;
      background: #141417;
      border: 1px solid var(--border);
      font-size: 11px;
      font-weight: 500;
      color: #909098;
      transition: all 0.15s ease;
    }

    .engine-chip.active {
      color: #e4e4e7;
      border-color: #3f3f46;
      background: #1a1a1e;
    }

    /* Dedicated Controls Bar (Below Divider) */
    .controls-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 10px 16px;
      margin-bottom: 14px;
    }

    .control-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex: 1;
      cursor: pointer;
      user-select: none;
    }

    .control-label-group {
      display: flex;
      flex-direction: column;
      pointer-events: none;
    }

    .control-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
      pointer-events: none;
    }

    .control-status-text {
      font-size: 10px;
      color: var(--text-dim);
      pointer-events: none;
    }

    .control-status-text.active {
      color: var(--text-muted);
      font-weight: 500;
      pointer-events: none;
    }

    /* Apple-Style Sliding Toggle Switch - Monochromatic */
    .ios-switch {
      position: relative;
      width: 34px;
      height: 19px;
      background-color: #27272a;
      border-radius: 999px;
      transition: background-color 0.2s ease, border-color 0.2s ease;
      cursor: pointer;
      flex-shrink: 0;
      border: 1px solid #3f3f46;
      pointer-events: none;
    }

    .ios-switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 13px;
      height: 13px;
      background-color: #71717a;
      border-radius: 50%;
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.2s ease;
      box-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }

    /* Monochromatic Active State (Clean White/Zinc Glow) */
    .ios-switch.on,
    .ios-switch.mute-on {
      background-color: #3f3f46;
      border-color: #71717a;
    }

    .ios-switch.on::after,
    .ios-switch.mute-on::after {
      transform: translateX(15px);
      background-color: #ffffff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.6);
    }

    .control-divider {
      width: 1px;
      height: 26px;
      background: var(--border);
    }

    /* Update Banner */
    .update-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #111a2e;
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 14px;
      font-size: 12px;
      animation: fadeIn 0.2s ease;
    }

    .update-banner.visible {
      display: flex;
    }

    .update-title {
      font-weight: 500;
      color: #93c5fd;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .update-btn {
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 5px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.15s ease;
    }

    .update-btn:hover {
      background: #1d4ed8;
    }

    .update-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Search & Filter Header Row */
    .history-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
      margin-bottom: 12px;
    }

    .history-group-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #71717a;
    }

    .search-icon-btn {
      background: transparent;
      border: none;
      color: #71717a;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 4px;
      transition: color 0.15s ease, background-color 0.15s ease;
    }

    .search-icon-btn:hover,
    .search-icon-btn.active {
      color: #e4e4e7;
      background: #27272a;
    }

    .search-inline-wrap {
      display: none;
      align-items: center;
      gap: 8px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 6px;
      padding: 4px 10px;
      margin-bottom: 12px;
      animation: fadeIn 0.15s ease;
    }

    .search-inline-wrap.visible {
      display: flex;
    }

    .search-inline-input {
      background: transparent;
      border: none;
      outline: none;
      color: #f4f4f5;
      font-size: 12px;
      width: 100%;
      font-family: inherit;
    }

    .search-inline-input::placeholder {
      color: #52525b;
    }

    /* History Feed Container */
    .feed {
      display: flex;
      flex-direction: column;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      overflow: hidden;
      min-height: 120px;
    }

    .feed-item {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      padding: 16px 20px;
      border-bottom: 1px solid #27272a;
      background: transparent;
      transition: background-color 0.15s ease;
      position: relative;
    }

    .feed-item:last-child {
      border-bottom: none;
    }

    .feed-item:hover {
      background: #1f1f23;
    }

    .feed-time-col {
      width: 62px;
      flex-shrink: 0;
      font-size: 12px;
      color: #71717a;
      font-variant-numeric: tabular-nums;
      padding-top: 1px;
      user-select: none;
    }

    .feed-content-col {
      flex: 1;
      min-width: 0;
      padding-right: 8px;
    }

    .feed-text {
      font-size: 13px;
      line-height: 1.5;
      color: #e4e4e7;
      word-break: break-word;
      user-select: text;
    }

    /* Trailing Action Icons (Play, Copy, Flag, More) */
    .feed-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      align-self: center;
      opacity: 0.85;
      transition: opacity 0.15s ease;
    }

    .action-icon-btn {
      background: transparent;
      border: none;
      color: #a1a1aa;
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 6px;
      transition: color 0.15s ease, background-color 0.15s ease, transform 0.1s ease;
    }

    .action-icon-btn:hover {
      color: #ffffff;
      background: #27272a;
    }

    .action-icon-btn:active {
      transform: scale(0.92);
    }

    .action-icon-btn.copied {
      color: #22c55e;
    }

    .action-icon-btn.flagged {
      color: #f59e0b;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 36px 20px;
      color: #71717a;
      font-size: 12px;
    }

    /* Footer */
    .footer {
      margin-top: 20px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-dim);
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .check-update-link {
      background: none;
      border: none;
      padding: 0;
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: underline;
      font-size: 11px;
      font-family: inherit;
    }

    .check-update-link:hover {
      color: var(--text);
    }

    .quit-link {
      background: none;
      border: none;
      padding: 0;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 11px;
      font-family: inherit;
      transition: color 0.15s ease;
    }

    .quit-link:hover {
      color: #ef4444;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Top Header: Brand Left, Subtle Neutral Engine Chips Right (NO GREEN) -->
  <header class="header">
    <div class="brand">
      <img src="/logo.png" alt="Logo" class="brand-icon">
      <div>
        <div class="brand-title">Flow Bridge</div>
        <div class="brand-subtitle">Universal Dictation Copy</div>
      </div>
    </div>
    <div class="header-engines" id="header-engines">
      <!-- Populated dynamically without green -->
    </div>
  </header>

  <!-- Dedicated Controls Bar (Below Divider) with Monochromatic Toggle Switches on the Right -->
  <div class="controls-bar">
    <!-- Sync Toggle -->
    <div class="control-item" onclick="togglePause()" title="Toggle universal clipboard sync">
      <div class="control-label-group">
        <span class="control-label">Universal Clipboard Sync</span>
        <span class="control-status-text active" id="sync-status-text">Active (⌘+V Ready)</span>
      </div>
      <div class="ios-switch on" id="sync-switch"></div>
    </div>

    <div class="control-divider"></div>

    <!-- Media Auto-Mute Toggle -->
    <div class="control-item" onclick="toggleMediaPause()" title="Auto-mute background audio/video while you speak">
      <div class="control-label-group">
        <span class="control-label">Mute Audio on Dictation</span>
        <span class="control-status-text" id="media-status-text">Enabled</span>
      </div>
      <div class="ios-switch mute-on" id="media-switch"></div>
    </div>
  </div>

  <!-- Auto-Update Notification Banner -->
  <div class="update-banner" id="update-banner">
    <div class="update-title">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m16 12-4-4-4 4"/><path d="M12 16V8"/></svg>
      <span>Flow Bridge <span id="update-version-text">v1.0.9</span> is available!</span>
    </div>
    <button class="update-btn" id="update-action-btn" onclick="startAutoUpdate()">
      <span>Install Update</span>
    </button>
  </div>

  <!-- Section Header Row: TODAY + Search Trigger -->
  <div class="history-header-row">
    <span class="history-group-title" id="history-group-label">TODAY</span>
    <button class="search-icon-btn" id="search-toggle-btn" title="Search dictations" onclick="toggleSearchInput()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
      </svg>
    </button>
  </div>

  <!-- Collapsible Search Input -->
  <div class="search-inline-wrap" id="search-inline-wrap">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
    </svg>
    <input type="text" class="search-inline-input" id="search-input" placeholder="Search dictation history..." oninput="onSearchChange(this.value)">
  </div>

  <div class="feed" id="history-container">
    <!-- Populated by JS -->
  </div>

  <!-- Minimal Footer with Check for Updates -->
  <footer class="footer">
    <div class="footer-left">
      <span id="app-version-label">v1.1.2</span>
      <span>•</span>
      <button class="check-update-link" id="check-update-btn" onclick="manualCheckUpdate()">Check for updates</button>
      <span>•</span>
      <button class="quit-link" id="quit-app-btn" onclick="quitFlowBridge()" title="Stop Flow Bridge and quit">Quit</button>
    </div>
    <span>Kernel Event Sync (0.0% CPU)</span>
  </footer>

  <script>
    const playSvg = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>`;
    const pauseSvg = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`;
    const copySvg = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="13" height="13" x="9" y="9" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
    const checkSvg = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
    const flagSvg = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>`;
    const moreSvg = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>`;

    let rawHistoryItems = [];
    let currentSearchTerm = '';
    let isSearchOpen = false;
    let hoveredIndex = 1; // Default highlight second row like in screenshot (or none)
    let flaggedItems = new Set();
    let playingIndex = null;
    let synth = window.speechSynthesis;
    let lastRenderHash = '';
    let lastAppsHash = '';
    let isPaused = false;
    let autoPauseMedia = true;
    let hideAppsToMenuBar = true;
    let updateData = null;

    let pauseToggleLockUntil = 0;
    let mediaToggleLockUntil = 0;
    let dockHideToggleLockUntil = 0;
    let isTogglingPause = false;
    let isTogglingMedia = false;
    let isTogglingDockHide = false;

    async function fetchState() {
      try {
        const res = await fetch('/api/state');
        if (!res.ok) return;
        const data = await res.json();
        
        if (data.version) {
          document.getElementById('app-version-label').textContent = 'v' + data.version;
        }

        const now = Date.now();
        if (now > pauseToggleLockUntil) {
          updatePauseButton(data.paused);
        }
        if (now > mediaToggleLockUntil) {
          updateMediaButton(data.auto_pause_media);
        }
        if (now > dockHideToggleLockUntil) {
          updateDockHideButton(data.hide_apps_to_menu_bar);
        }
        renderApps(data.apps);
        rawHistoryItems = data.history || [];
        renderFilteredHistory();

        if (data.update) {
          handleUpdateState(data.update);
        }
      } catch (e) {
        // network or server restart
      }
    }

    function updatePauseButton(paused) {
      isPaused = !!paused;
      const sw = document.getElementById('sync-switch');
      const text = document.getElementById('sync-status-text');
      if (sw && text) {
        if (isPaused) {
          sw.classList.remove('on');
          text.classList.remove('active');
          text.textContent = 'Paused (Sync Off)';
        } else {
          sw.classList.add('on');
          text.classList.add('active');
          text.textContent = 'Active (⌘+V Ready)';
        }
      }
    }

    function updateMediaButton(enabled) {
      autoPauseMedia = !!enabled;
      const sw = document.getElementById('media-switch');
      const text = document.getElementById('media-status-text');
      if (sw && text) {
        if (autoPauseMedia) {
          sw.classList.add('mute-on');
          text.classList.add('active');
          text.textContent = 'Enabled (Instant Mute)';
          text.style.color = '';
        } else {
          sw.classList.remove('mute-on');
          text.classList.remove('active');
          text.textContent = 'Disabled';
          text.style.color = '';
        }
      }
    }

    function updateDockHideButton(enabled) {
      hideAppsToMenuBar = !!enabled;
      const sw = document.getElementById('dock-hide-switch');
      const text = document.getElementById('dock-hide-status-text');
      if (sw && text) {
        if (hideAppsToMenuBar) {
          sw.classList.add('on');
          text.classList.add('active');
          text.textContent = 'Enabled (Menu Bar)';
          text.style.color = '';
        } else {
          sw.classList.remove('on');
          text.classList.remove('active');
          text.textContent = 'Disabled (Keep in Dock)';
          text.style.color = '';
        }
      }
    }

    async function togglePause() {
      if (isTogglingPause) return;
      isTogglingPause = true;

      // 1. Optimistic instant visual flip (0ms response)
      const targetState = !isPaused;
      updatePauseButton(targetState);
      pauseToggleLockUntil = Date.now() + 1500;

      try {
        const res = await fetch('/api/toggle-pause');
        if (res.ok) {
          const data = await res.json();
          updatePauseButton(data.paused);
        } else {
          // Revert on error
          updatePauseButton(!targetState);
        }
      } catch (e) {
        updatePauseButton(!targetState);
        console.error(e);
      } finally {
        isTogglingPause = false;
      }
    }

    async function toggleMediaPause() {
      if (isTogglingMedia) return;
      isTogglingMedia = true;

      // 1. Optimistic instant visual flip (0ms response)
      const targetState = !autoPauseMedia;
      updateMediaButton(targetState);
      mediaToggleLockUntil = Date.now() + 1500;

      try {
        const res = await fetch('/api/toggle-media-pause');
        if (res.ok) {
          const data = await res.json();
          updateMediaButton(data.auto_pause_media);
        } else {
          // Revert on error
          updateMediaButton(!targetState);
        }
      } catch (e) {
        updateMediaButton(!targetState);
        console.error(e);
      } finally {
        isTogglingMedia = false;
      }
    }

    async function toggleDockHide() {
      if (isTogglingDockHide) return;
      isTogglingDockHide = true;

      // 1. Optimistic instant visual flip (0ms response)
      const targetState = !hideAppsToMenuBar;
      updateDockHideButton(targetState);
      dockHideToggleLockUntil = Date.now() + 1500;

      try {
        const res = await fetch('/api/toggle-dock-hide');
        if (res.ok) {
          const data = await res.json();
          updateDockHideButton(data.hide_apps_to_menu_bar);
        } else {
          // Revert on error
          updateDockHideButton(!targetState);
        }
      } catch (e) {
        updateDockHideButton(!targetState);
        console.error(e);
      } finally {
        isTogglingDockHide = false;
      }
    }

    function handleUpdateState(info) {
      updateData = info;
      const banner = document.getElementById('update-banner');
      const verText = document.getElementById('update-version-text');
      if (info && info.has_update) {
        verText.textContent = 'v' + info.latest_version;
        banner.classList.add('visible');
      } else {
        banner.classList.remove('visible');
      }
    }

    async function manualCheckUpdate() {
      const btn = document.getElementById('check-update-btn');
      btn.textContent = 'Checking...';
      try {
        const res = await fetch('/api/check-update');
        if (res.ok) {
          const info = await res.json();
          handleUpdateState(info);
          if (info.has_update) {
            btn.textContent = 'Update available!';
          } else {
            btn.textContent = 'Up to date';
            setTimeout(() => { btn.textContent = 'Check for updates'; }, 3000);
          }
        }
      } catch (e) {
        btn.textContent = 'Check failed';
        setTimeout(() => { btn.textContent = 'Check for updates'; }, 3000);
      }
    }

    async function startAutoUpdate() {
      const btn = document.getElementById('update-action-btn');
      btn.disabled = true;
      btn.innerHTML = `<span>Updating...</span>`;
      try {
        const res = await fetch('/api/auto-update');
        const result = await res.json();
        if (result.success) {
          btn.innerHTML = `<span>Installed! Restarting...</span>`;
          setTimeout(() => {
            window.location.reload();
          }, 3000);
        } else {
          btn.disabled = false;
          btn.innerHTML = `<span>Retry Update</span>`;
          alert('Update failed: ' + (result.error || 'Unknown error'));
        }
      } catch (e) {
        btn.disabled = false;
        btn.innerHTML = `<span>Retry</span>`;
        alert('Update request failed: ' + e);
      }
    }

    function toggleSearchInput() {
      isSearchOpen = !isSearchOpen;
      const wrap = document.getElementById('search-inline-wrap');
      const btn = document.getElementById('search-toggle-btn');
      const input = document.getElementById('search-input');
      if (wrap && btn) {
        if (isSearchOpen) {
          wrap.classList.add('visible');
          btn.classList.add('active');
          if (input) input.focus();
        } else {
          wrap.classList.remove('visible');
          btn.classList.remove('active');
          if (input) {
            input.value = '';
            onSearchChange('');
          }
        }
      }
    }

    function onSearchChange(val) {
      currentSearchTerm = (val || '').trim().toLowerCase();
      renderFilteredHistory(true);
    }

    function renderApps(apps) {
      if (!apps) return;
      const hash = JSON.stringify(apps.map(a => a.name + a.available));
      if (hash === lastAppsHash) return; // Prevent unnecessary DOM teardown
      lastAppsHash = hash;

      const container = document.getElementById('header-engines');
      if (!container) return;

      // Clean, monochromatic chips without dots
      container.innerHTML = apps.map(app => `
        <div class="engine-chip ${app.available ? 'active' : ''}" title="${app.name}: ${app.available ? 'Connected' : 'Not installed'}">
          <span>${escapeHtml(app.name)}</span>
        </div>
      `).join('');
    }

    function renderFilteredHistory(force = false) {
      let filtered = rawHistoryItems;
      if (currentSearchTerm) {
        filtered = rawHistoryItems.filter(item => 
          (item.text && item.text.toLowerCase().includes(currentSearchTerm)) ||
          (item.source && item.source.toLowerCase().includes(currentSearchTerm))
        );
      }

      // Content hash check to avoid hover flicker during polling
      const hash = currentSearchTerm + '::' + JSON.stringify(filtered.map(i => i.id + i.text)) + '::' + hoveredIndex + '::' + Array.from(flaggedItems).join(',') + '::' + playingIndex;
      if (!force && hash === lastRenderHash) return;
      lastRenderHash = hash;

      const container = document.getElementById('history-container');
      if (!container) return;

      if (filtered.length === 0) {
        if (currentSearchTerm) {
          container.innerHTML = `<div class="empty-state">No dictations match "${escapeHtml(currentSearchTerm)}".</div>`;
        } else {
          container.innerHTML = `<div class="empty-state">No dictations recorded yet. Speak into Wispr Flow, Handy, or Detta.</div>`;
        }
        return;
      }

      container.innerHTML = filtered.map((item, idx) => {
        const isHovered = (idx === hoveredIndex);
        const isFlagged = flaggedItems.has(item.id || idx);
        const isPlaying = (playingIndex === idx);

        return `
          <div class="feed-item" onmouseenter="setHovered(${idx})" onmouseleave="clearHovered(${idx})">
            <div class="feed-time-col">${escapeHtml(item.time || '')}</div>
            <div class="feed-content-col">
              <div class="feed-text">${escapeHtml(item.text)}</div>
            </div>
            <div class="feed-actions" style="visibility: ${isHovered ? 'visible' : 'hidden'};">
              <button class="action-icon-btn ${isPlaying ? 'copied' : ''}" title="${isPlaying ? 'Stop playback' : 'Play voice preview'}" onclick="togglePlayVoice(${idx}, this)">
                ${isPlaying ? pauseSvg : playSvg}
              </button>
              <button class="action-icon-btn" title="Copy to clipboard" onclick="copyText(${idx}, this)">
                ${copySvg}
              </button>
              <button class="action-icon-btn ${isFlagged ? 'flagged' : ''}" title="${isFlagged ? 'Unpin/Unflag' : 'Pin/Flag dictation'}" onclick="toggleFlag(${idx})">
                ${flagSvg}
              </button>
              <button class="action-icon-btn" title="More options" onclick="showMoreMenu(${idx}, this)">
                ${moreSvg}
              </button>
            </div>
          </div>
        `;
      }).join('');

      window._currentFiltered = filtered;
    }

    function setHovered(idx) {
      hoveredIndex = idx;
      renderFilteredHistory(true);
    }

    function clearHovered(idx) {
      if (hoveredIndex === idx) {
        hoveredIndex = null;
        renderFilteredHistory(true);
      }
    }

    function toggleFlag(idx) {
      const item = window._currentFiltered?.[idx];
      if (!item) return;
      const key = item.id || idx;
      if (flaggedItems.has(key)) {
        flaggedItems.delete(key);
      } else {
        flaggedItems.add(key);
      }
      renderFilteredHistory(true);
    }

    function togglePlayVoice(idx, btn) {
      const item = window._currentFiltered?.[idx];
      if (!item || !synth) return;

      if (playingIndex === idx) {
        synth.cancel();
        playingIndex = null;
        renderFilteredHistory(true);
        return;
      }

      synth.cancel();
      playingIndex = idx;
      renderFilteredHistory(true);

      const utterance = new SpeechSynthesisUtterance(item.text);
      utterance.rate = 1.05;
      utterance.onend = () => {
        if (playingIndex === idx) {
          playingIndex = null;
          renderFilteredHistory(true);
        }
      };
      utterance.onerror = () => {
        playingIndex = null;
        renderFilteredHistory(true);
      };
      synth.speak(utterance);
    }

    function showMoreMenu(idx, btn) {
      const item = window._currentFiltered?.[idx];
      if (!item) return;
      // Native fast action: quick copy with quote or trigger paste
      const options = `Dictated via: ${item.source || 'Voice Engine'}\nTimestamp: ${item.time}\n\nPress ⌘+V anywhere to paste this text.`;
      alert(options);
    }

    function copyText(idx, btn) {
      const item = window._currentFiltered?.[idx];
      if (!item) return;

      navigator.clipboard.writeText(item.text).then(() => {
        btn.classList.add('copied');
        btn.innerHTML = checkSvg;
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = copySvg;
        }, 1500);
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    async function quitFlowBridge() {
      if (!confirm('Are you sure you want to quit Flow Bridge?')) return;
      try {
        await fetch('/api/quit', { method: 'POST' });
      } catch (e) {}
      document.body.innerHTML = `
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:80vh;text-align:center;color:#8e8e93;gap:12px;">
          <div style="font-size:16px;font-weight:600;color:#ededed;">Flow Bridge Stopped</div>
          <div style="font-size:12px;">The application and daemon have quit cleanly. You can close this window.</div>
        </div>
      `;
    }

    // Energy-saving adaptive polling: Only poll when the window/popover is visible to user
    let pollTimer = null;

    function startPolling() {
      if (pollTimer) return;
      fetchState();
      pollTimer = setInterval(() => {
        if (!document.hidden) {
          fetchState();
        }
      }, 2500);
    }

    function stopPolling() {
      if (pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        stopPolling();
      } else {
        startPolling();
      }
    });

    startPolling();
  </script>
</body>
</html>
