<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flow Bridge</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <style>
    :root {
      --bg: #09090b;
      --card: #111113;
      --border: #202023;
      --border-hover: #323238;
      --text: #ededed;
      --text-muted: #80808a;
      --text-dim: #52525b;
      --green: #22c55e;
      --green-dim: rgba(34, 197, 94, 0.12);
      --amber: #f59e0b;
      --amber-dim: rgba(245, 158, 11, 0.12);
      --blue: #3b82f6;
      --blue-dim: rgba(59, 130, 246, 0.15);
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, sans-serif;
      --font-mono: "SF Mono", Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.5;
      padding: 18px 20px 20px;
      max-width: 680px;
      margin: 0 auto;
      user-select: none;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 14px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .brand-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Controls in header */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .header-engines {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .engine-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      transition: all 0.15s ease;
    }

    .engine-chip.active {
      color: var(--text);
      border-color: rgba(34, 197, 94, 0.25);
      background: #141417;
    }

    .engine-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--green);
      flex-shrink: 0;
    }

    .engine-dot.inactive {
      background: var(--text-dim);
    }

    /* Pause / Resume button */
    .sync-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .sync-toggle-btn:hover {
      border-color: var(--border-hover);
      background: #18181c;
    }

    .sync-toggle-btn.paused {
      border-color: rgba(245, 158, 11, 0.35);
      color: var(--amber);
      background: var(--amber-dim);
    }

    .sync-indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px rgba(34, 197, 94, 0.6);
    }

    .sync-toggle-btn.paused .sync-indicator {
      background: var(--amber);
      box-shadow: 0 0 6px rgba(245, 158, 11, 0.6);
    }

    /* Search & Filter Bar */
    .search-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .search-wrapper {
      position: relative;
      flex: 1;
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 10px 6px 32px;
      font-size: 12px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s ease;
      font-family: inherit;
    }

    .search-input:focus {
      border-color: #3b82f6;
    }

    .search-input::placeholder {
      color: var(--text-dim);
    }

    /* Update Banner (Shown when update is available) */
    .update-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #111a2e;
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 14px;
      font-size: 12px;
      animation: fadeIn 0.2s ease;
    }

    .update-banner.visible {
      display: flex;
    }

    .update-title {
      font-weight: 500;
      color: #93c5fd;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .update-btn {
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 5px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.15s ease;
    }

    .update-btn:hover {
      background: #1d4ed8;
    }

    .update-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Section Bar */
    .section-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
    }

    .section-hint {
      font-size: 11px;
      color: var(--text-dim);
    }

    .kbd {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 1px 4px;
      border-radius: 3px;
      background: #18181b;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    /* History Feed */
    .feed {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 120px;
    }

    .feed-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .feed-item:hover {
      border-color: var(--border-hover);
      background: #141417;
    }

    .feed-body {
      flex: 1;
      min-width: 0;
    }

    .feed-text {
      font-size: 13px;
      color: #dedee0;
      line-height: 1.45;
      word-break: break-word;
      user-select: text;
      margin-bottom: 5px;
    }

    .feed-meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 7px;
      border-radius: 999px;
      background: #17171a;
      border: 1px solid var(--border);
      font-size: 10px;
    }

    .source-tag {
      font-weight: 500;
      color: #a1a1aa;
    }

    .meta-separator {
      font-size: 9px;
      color: var(--text-dim);
    }

    .feed-time {
      color: var(--text-dim);
      font-family: var(--font-mono);
    }

    /* Copy Button */
    .copy-button {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-dim);
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s ease;
      margin-top: 1px;
    }

    .copy-button:hover {
      color: var(--text);
      border-color: var(--border-hover);
      background: #1c1c20;
    }

    .copy-button:active {
      transform: scale(0.92);
    }

    .copy-button.copied {
      color: var(--green);
      border-color: rgba(34, 197, 94, 0.4);
      background: var(--green-dim);
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 32px 20px;
      color: var(--text-dim);
      font-size: 12px;
      border: 1px dashed var(--border);
      border-radius: 8px;
    }

    /* Footer */
    .footer {
      margin-top: 20px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-dim);
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .check-update-link {
      background: none;
      border: none;
      padding: 0;
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: underline;
      font-size: 11px;
      font-family: inherit;
    }

    .check-update-link:hover {
      color: var(--text);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Header with Brand on Left and Engines + Pause on Right -->
  <header class="header">
    <div class="brand">
      <img src="/logo.png" alt="Logo" class="brand-icon">
      <div>
        <div class="brand-title">Flow Bridge</div>
        <div class="brand-subtitle">Universal Dictation Copy</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="sync-toggle-btn" id="sync-toggle-btn" onclick="togglePause()" title="Click to pause/resume auto clipboard sync">
        <span class="sync-indicator"></span>
        <span id="sync-toggle-text">Active</span>
      </button>
      <div class="header-engines" id="header-engines">
        <!-- Populated dynamically -->
      </div>
    </div>
  </header>

  <!-- Auto-Update Notification Banner -->
  <div class="update-banner" id="update-banner">
    <div class="update-title">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m16 12-4-4-4 4"/><path d="M12 16V8"/></svg>
      <span>Flow Bridge <span id="update-version-text">v1.0.9</span> is available!</span>
    </div>
    <button class="update-btn" id="update-action-btn" onclick="startAutoUpdate()">
      <span>Install Update</span>
    </button>
  </div>

  <!-- Search Filter Input -->
  <div class="search-row">
    <div class="search-wrapper">
      <svg class="search-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
      </svg>
      <input type="text" class="search-input" id="search-input" placeholder="Search dictation history..." oninput="onSearchChange(this.value)">
    </div>
  </div>

  <!-- Recent Dictation Feed -->
  <div class="section-bar">
    <span class="section-title">Latest Dictations</span>
    <span class="section-hint">Press <kbd class="kbd">⌘ + V</kbd> anywhere to paste</span>
  </div>

  <div class="feed" id="history-container">
    <!-- Populated by JS -->
  </div>

  <!-- Minimal Footer with Check for Updates -->
  <footer class="footer">
    <div class="footer-left">
      <span id="app-version-label">v1.0.8</span>
      <span>•</span>
      <button class="check-update-link" id="check-update-btn" onclick="manualCheckUpdate()">Check for updates</button>
    </div>
    <span>Auto-settle & hold active</span>
  </footer>

  <script>
    const copySvg = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>`;
    const checkSvg = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;

    let rawHistoryItems = [];
    let currentSearchTerm = '';
    let lastRenderHash = '';
    let lastAppsHash = '';
    let isPaused = false;
    let updateData = null;

    async function fetchState() {
      try {
        const res = await fetch('/api/state');
        if (!res.ok) return;
        const data = await res.json();
        
        if (data.version) {
          document.getElementById('app-version-label').textContent = 'v' + data.version;
        }

        updatePauseButton(data.paused);
        renderApps(data.apps);
        rawHistoryItems = data.history || [];
        renderFilteredHistory();

        if (data.update) {
          handleUpdateState(data.update);
        }
      } catch (e) {
        // network or server restart
      }
    }

    function updatePauseButton(paused) {
      isPaused = !!paused;
      const btn = document.getElementById('sync-toggle-btn');
      const text = document.getElementById('sync-toggle-text');
      if (btn && text) {
        if (isPaused) {
          btn.classList.add('paused');
          text.textContent = 'Paused';
          btn.title = 'Sync is paused. Click to resume copying dictations.';
        } else {
          btn.classList.remove('paused');
          text.textContent = 'Active';
          btn.title = 'Sync is active. Click to pause.';
        }
      }
    }

    async function togglePause() {
      try {
        const res = await fetch('/api/toggle-pause');
        if (res.ok) {
          const data = await res.json();
          updatePauseButton(data.paused);
        }
      } catch (e) {
        console.error(e);
      }
    }

    function handleUpdateState(info) {
      updateData = info;
      const banner = document.getElementById('update-banner');
      const verText = document.getElementById('update-version-text');
      if (info && info.has_update) {
        verText.textContent = 'v' + info.latest_version;
        banner.classList.add('visible');
      } else {
        banner.classList.remove('visible');
      }
    }

    async function manualCheckUpdate() {
      const btn = document.getElementById('check-update-btn');
      btn.textContent = 'Checking...';
      try {
        const res = await fetch('/api/check-update');
        if (res.ok) {
          const info = await res.json();
          handleUpdateState(info);
          if (info.has_update) {
            btn.textContent = 'Update available!';
          } else {
            btn.textContent = 'Up to date';
            setTimeout(() => { btn.textContent = 'Check for updates'; }, 3000);
          }
        }
      } catch (e) {
        btn.textContent = 'Check failed';
        setTimeout(() => { btn.textContent = 'Check for updates'; }, 3000);
      }
    }

    async function startAutoUpdate() {
      const btn = document.getElementById('update-action-btn');
      btn.disabled = true;
      btn.innerHTML = `<span>Updating...</span>`;
      try {
        const res = await fetch('/api/auto-update');
        const result = await res.json();
        if (result.success) {
          btn.innerHTML = `<span>Installed! Restarting...</span>`;
          setTimeout(() => {
            window.location.reload();
          }, 3000);
        } else {
          btn.disabled = false;
          btn.innerHTML = `<span>Retry Update</span>`;
          alert('Update failed: ' + (result.error || 'Unknown error'));
        }
      } catch (e) {
        btn.disabled = false;
        btn.innerHTML = `<span>Retry</span>`;
        alert('Update request failed: ' + e);
      }
    }

    function onSearchChange(val) {
      currentSearchTerm = (val || '').trim().toLowerCase();
      renderFilteredHistory(true);
    }

    function renderApps(apps) {
      if (!apps) return;
      const hash = JSON.stringify(apps.map(a => a.name + a.available));
      if (hash === lastAppsHash) return; // Prevent unnecessary DOM teardown
      lastAppsHash = hash;

      const container = document.getElementById('header-engines');
      if (!container) return;

      container.innerHTML = apps.map(app => `
        <div class="engine-chip ${app.available ? 'active' : ''}" title="${app.name}: ${app.available ? 'Connected' : 'Not installed'}">
          <span class="engine-dot ${app.available ? '' : 'inactive'}"></span>
          <span>${escapeHtml(app.name)}</span>
        </div>
      `).join('');
    }

    function renderFilteredHistory(force = false) {
      let filtered = rawHistoryItems;
      if (currentSearchTerm) {
        filtered = rawHistoryItems.filter(item => 
          (item.text && item.text.toLowerCase().includes(currentSearchTerm)) ||
          (item.source && item.source.toLowerCase().includes(currentSearchTerm))
        );
      }

      // Content hash check to avoid hover flicker during polling
      const hash = currentSearchTerm + '::' + JSON.stringify(filtered.map(i => i.id + i.text));
      if (!force && hash === lastRenderHash) return;
      lastRenderHash = hash;

      const container = document.getElementById('history-container');
      if (!container) return;

      if (filtered.length === 0) {
        if (currentSearchTerm) {
          container.innerHTML = `<div class="empty-state">No dictations match "${escapeHtml(currentSearchTerm)}".</div>`;
        } else {
          container.innerHTML = `<div class="empty-state">No dictations recorded yet. Speak into Wispr Flow, Handy, or Detta.</div>`;
        }
        return;
      }

      container.innerHTML = filtered.map((item, idx) => `
        <div class="feed-item">
          <div class="feed-body">
            <div class="feed-text">${escapeHtml(item.text)}</div>
            <div class="feed-meta-pill">
              <span class="source-tag">${escapeHtml(item.source)}</span>
              <span class="meta-separator">•</span>
              <span class="feed-time">${item.time}</span>
            </div>
          </div>
          <button class="copy-button" title="Copy transcript to clipboard" onclick="copyText(${idx}, this)">
            ${copySvg}
          </button>
        </div>
      `).join('');

      window._currentFiltered = filtered;
    }

    function copyText(idx, btn) {
      const item = window._currentFiltered?.[idx];
      if (!item) return;

      navigator.clipboard.writeText(item.text).then(() => {
        btn.classList.add('copied');
        btn.innerHTML = checkSvg;
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = copySvg;
        }, 1500);
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    fetchState();
    setInterval(fetchState, 1500);
  </script>
</body>
</html>
