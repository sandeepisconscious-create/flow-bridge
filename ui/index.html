<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flow Bridge</title>
  <style>
    /* shadcn/ui zinc dark palette */
    :root {
      --background: #09090b;
      --foreground: #fafafa;
      --card: #121215;
      --card-foreground: #fafafa;
      --popover: #09090b;
      --popover-foreground: #fafafa;
      --primary: #fafafa;
      --primary-foreground: #18181b;
      --secondary: #27272a;
      --secondary-foreground: #fafafa;
      --muted: #1e1e24;
      --muted-foreground: #a1a1aa;
      --accent: #27272a;
      --accent-foreground: #fafafa;
      --destructive: #7f1d1d;
      --destructive-foreground: #fafafa;
      --border: #27272a;
      --input: #27272a;
      --ring: #d4d4d8;
      --radius: 0.5rem;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--background);
      color: var(--foreground);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      padding: 20px;
      user-select: none;
      overflow-x: hidden;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mascot-avatar {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      object-fit: cover;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .title-group h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .title-group p {
      font-size: 12px;
      color: var(--muted-foreground);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 500;
      background: rgba(16, 185, 129, 0.12);
      color: #34d399;
      border: 1px solid rgba(52, 211, 153, 0.25);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #34d399;
      box-shadow: 0 0 8px #34d399;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.9); }
    }

    /* Section Headings */
    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted-foreground);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Detected Apps Grid */
    .apps-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .app-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: border-color 0.15s ease;
    }

    .app-card:hover {
      border-color: #3f3f46;
    }

    .app-icon-wrap {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .app-info {
      flex: 1;
      min-width: 0;
    }

    .app-name {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .app-status {
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .app-status.active { color: #34d399; }
    .app-status.missing { color: var(--muted-foreground); }

    /* Dictations History List */
    .history-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .history-card:hover {
      background: #18181b;
      border-color: #3f3f46;
    }

    .history-main {
      flex: 1;
      min-width: 0;
    }

    .history-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .meta-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--secondary);
      color: var(--secondary-foreground);
    }

    .meta-badge.wispr {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .meta-badge.detta {
      background: rgba(168, 85, 247, 0.15);
      color: #c084fc;
      border: 1px solid rgba(168, 85, 247, 0.3);
    }

    .meta-badge.handy {
      background: rgba(244, 114, 182, 0.15);
      color: #f472b6;
      border: 1px solid rgba(244, 114, 182, 0.35);
    }

    .meta-time {
      font-size: 11px;
      color: var(--muted-foreground);
    }

    .history-text {
      font-size: 13px;
      color: #e4e4e7;
      line-height: 1.45;
      word-break: break-word;
      user-select: text;
    }

    /* Copy Button (shadcn outline button) */
    .copy-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted-foreground);
      border-radius: 6px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .copy-btn:hover {
      background: var(--secondary);
      color: var(--foreground);
      border-color: #52525b;
    }

    .copy-btn:active {
      transform: scale(0.94);
    }

    .copy-btn.copied {
      color: #34d399;
      border-color: rgba(52, 211, 153, 0.4);
      background: rgba(52, 211, 153, 0.1);
    }

    /* Footer */
    .footer {
      margin-top: 24px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted-foreground);
    }

    .kbd {
      font-family: ui-monospace, Menlo, Monaco, Consolas, monospace;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--secondary);
      border: 1px solid var(--border);
      color: var(--foreground);
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <div class="header">
    <div class="brand">
      <img src="../assets/logo.png" alt="Logo" class="mascot-avatar" id="mascot-img">
      <div class="title-group">
        <h1>Flow Bridge</h1>
        <p>Universal Dictation Clipboard Hub</p>
      </div>
    </div>
    <div class="status-badge">
      <span class="status-dot"></span>
      <span id="global-status">Live Sync Active</span>
    </div>
  </div>

  <!-- Detected Dictation Engines -->
  <div class="section-title">
    <span>Detected Voice Dictation Apps</span>
    <span id="detected-count-pill" style="font-size: 10px; color: #34d399;">Scanning...</span>
  </div>

  <div class="apps-grid" id="apps-container">
    <!-- Populated by JS -->
  </div>

  <!-- Recent Dictation History -->
  <div class="section-title">
    <span>Latest 10 Dictations</span>
    <span style="font-size: 11px; font-weight: normal; text-transform: none; color: var(--muted-foreground);">Press <kbd class="kbd">⌘V</kbd> anywhere</span>
  </div>

  <div class="history-container" id="history-container">
    <!-- Populated by JS -->
  </div>

  <!-- Footer -->
  <div class="footer">
    <span>Running silently in background</span>
    <span>Auto-settle & hold active</span>
  </div>

  <script>
    // Copy icon SVG & Checkmark SVG
    const copyIconSvg = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>`;
    const checkIconSvg = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;

    async function fetchState() {
      try {
        const res = await fetch('/api/state');
        if (!res.ok) return;
        const data = await res.json();
        renderApps(data.apps);
        renderHistory(data.history);
      } catch (err) {
        // Fetch error during reload
      }
    }

    function getBadgeClass(source) {
      const s = (source || '').toLowerCase();
      if (s.includes('wispr')) return 'wispr';
      if (s.includes('detta')) return 'detta';
      if (s.includes('handy')) return 'handy';
      return '';
    }

    function getAppIcon(name) {
      const n = (name || '').toLowerCase();
      if (n.includes('wispr')) return '🎙️';
      if (n.includes('handy')) return '✋';
      if (n.includes('detta')) return '⚡';
      return '🎤';
    }

    function renderApps(apps) {
      const container = document.getElementById('apps-container');
      const countPill = document.getElementById('detected-count-pill');
      if (!apps || !container) return;

      const activeCount = apps.filter(a => a.available).length;
      countPill.textContent = `${activeCount} of ${apps.length} Active`;

      container.innerHTML = apps.map(app => `
        <div class="app-card">
          <div class="app-icon-wrap">${getAppIcon(app.name)}</div>
          <div class="app-info">
            <div class="app-name">${app.name}</div>
            <div class="app-status ${app.available ? 'active' : 'missing'}">
              ${app.available ? '● Connected & Monitored' : '○ Not Detected'}
            </div>
          </div>
        </div>
      `).join('');
    }

    function renderHistory(items) {
      const container = document.getElementById('history-container');
      if (!items || !container) return;

      if (items.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding: 28px; color: var(--muted-foreground);">No dictations recorded yet. Speak into Wispr Flow, Handy, or Detta to test!</div>`;
        return;
      }

      container.innerHTML = items.map((item, idx) => `
        <div class="history-card">
          <div class="history-main">
            <div class="history-meta">
              <span class="meta-badge ${getBadgeClass(item.source)}">${item.source}</span>
              <span class="meta-time">${item.time}</span>
            </div>
            <div class="history-text">${escapeHtml(item.text)}</div>
          </div>
          <button class="copy-btn" title="Copy transcript to clipboard" onclick="copyText(${idx}, this)">
            ${copyIconSvg}
          </button>
        </div>
      `).join('');

      // Store in memory for instant copy
      window._historyItems = items;
    }

    function copyText(idx, btn) {
      const item = window._historyItems?.[idx];
      if (!item) return;

      navigator.clipboard.writeText(item.text).then(() => {
        btn.classList.add('copied');
        btn.innerHTML = checkIconSvg;
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = copyIconSvg;
        }, 1800);
      });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // Initial fetch and 1.5s refresh poll
    fetchState();
    setInterval(fetchState, 1500);
  </script>
</body>
</html>
